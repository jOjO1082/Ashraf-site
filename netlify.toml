# Netlify configuration — static site, no build step.
[build]
  publish = "."

# Long-lived caching for files that never change name/content.
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/js/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# The old HealTV nav link on the previous site pointed at a file that never existed.
[[redirects]]
  from = "/healt.html"
  to = "/healtv"
  status = 301

[[redirects]]
  from = "/clients"
  to = "/client"
  status = 301

[[redirects]]
  from = "/contact"
  to = "/#contact"
  status = 301
